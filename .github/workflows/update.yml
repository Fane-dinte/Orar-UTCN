name: Update timetables

# Rebuilds utcna.pages.dev from every faculty's official timetable and publishes it when something changed.
# Uses the repo's existing settings: secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# variables CF_PROJECT (the Pages project, utcna), ORAR_URL (the Automatică share link) and, optionally,
# EDUPAGE_RELAY (a Cloudflare Worker that relays the Construcții EduPage calls when GitHub's runners are refused).

on:
  schedule:
    # every hour between ~7 and ~22 Romanian time on weekdays, twice a day at weekends
    - cron: "17 4-19 * * 1-5"
    - cron: "17 6,16 * * 0,6"
  push:
    paths:
      - "public/**"
      - "lib/**"
      - "scripts/**"
      - "pdf/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: orar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r pdf/requirements.txt

      - name: Download the official timetables and rebuild the site
        env:
          ORAR_URL: ${{ vars.ORAR_URL }}
          EDUPAGE_RELAY: ${{ vars.EDUPAGE_RELAY }}
        # a faculty whose site fails today keeps its last good timetable
        run: node scripts/build.mjs --fetch

      - name: Did anything change?
        id: changed
        run: |
          git add public/data
          if git diff --cached --quiet && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "No timetable changed. Nothing to publish."
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Cloudflare Pages
        if: steps.changed.outputs.yes == 'true'
        run: npx --yes wrangler@3.114.0 pages deploy public --project-name "${CF_PROJECT:-utcna}" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}

      - name: Save the published data
        if: steps.changed.outputs.yes == 'true'
        run: |
          git config user.name "orar-bot"
          git config user.email "orar-bot@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Timetable updated $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
